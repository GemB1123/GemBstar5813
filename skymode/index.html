<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">

<title>Sky Mode</title>
<style>
:root{--ink:#efe3c8;--dim:#a99f8a;--gold:#d1ab74;--panel:rgba(12,14,24,.82);--line:rgba(209,171,116,.45);color-scheme:dark}
*{box-sizing:border-box}html,body{margin:0;height:100%;background:#04060f;color:var(--ink);font:15px/1.35 -apple-system,BlinkMacSystemFont,Inter,Segoe UI,sans-serif;overflow:hidden;-webkit-user-select:none;user-select:none;touch-action:none}
canvas{position:fixed;inset:0;display:block}
.top{position:fixed;top:0;left:0;right:0;padding:calc(env(safe-area-inset-top) + 8px) 16px 8px;display:flex;justify-content:space-between;gap:8px;pointer-events:none}
.top div{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:6px 10px;font-size:13px}
.top b{color:var(--gold)}
#aim{position:fixed;left:50%;top:calc(50% + 26px);transform:translateX(-50%);font-size:12px;color:var(--dim);pointer-events:none;white-space:nowrap}
.bar{position:fixed;left:0;right:0;bottom:0;padding:8px 16px calc(env(safe-area-inset-bottom) + 10px);display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
button{font:inherit;font-size:14px;font-weight:600;color:var(--ink);background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:9px 12px;min-height:44px;cursor:pointer}
button.on,button[aria-pressed="true"]{background:var(--gold);color:#1b1408;border-color:var(--gold)}
#start{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);font-size:18px;padding:16px 22px;background:var(--gold);color:#1b1408;z-index:3;box-shadow:0 8px 30px rgba(0,0,0,.6)}
#info{position:fixed;left:16px;right:16px;bottom:calc(env(safe-area-inset-bottom) + 120px);background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:10px 12px;font-size:14px;pointer-events:none}
#info b{color:var(--gold);font-size:16px}
#alist{position:fixed;left:16px;right:16px;bottom:calc(env(safe-area-inset-bottom) + 120px);max-height:50vh;overflow:auto;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:10px;display:flex;flex-wrap:wrap;gap:6px;z-index:2}
#alist[hidden],#info[hidden],button[hidden]{display:none}
#alist p{margin:0 0 4px;width:100%;font-size:13px;color:var(--dim)}
#msg{position:fixed;left:16px;right:16px;top:calc(env(safe-area-inset-top) + 56px);text-align:center;font-size:13px;color:var(--dim);pointer-events:none}
body.night{filter:grayscale(1) sepia(1) saturate(9) hue-rotate(-40deg) brightness(.75)}
</style></head><body>

  g.stroke();if(ST.names){g.fillStyle='rgba(160,180,225,.8)';g.font=`${12*tiny}px -apple-system,Inter,sans-serif`;g.textAlign='center';for(const [n,x,y] of lab)g.fillText(n,x,y+18)}}
 /* stars, fading in daylight */
 const lim=sa>-1?1.0:sa>-6?2.5:sa>-12?4.5:5.6;
 g.fillStyle='#fff';for(let i=0;i<K.stars.length;i++){const v=K.stars[i];if(!v)continue;const m=D.stars[i][2];if(m>lim)continue;const p=proj(v);if(!p||p[0]<-5||p[0]>W+5||p[1]<-5||p[1]>H+5)continue;
  g.globalAlpha=Math.min(1,0.35+(lim-m)*0.25);g.beginPath();g.arc(p[0],p[1],Math.max(0.6,(3.2-m*0.5))*tiny,0,7);g.fill()}
 g.globalAlpha=1;
 if(ST.snames){g.fillStyle='rgba(255,255,255,.75)';g.font=`${11*tiny}px -apple-system,Inter,sans-serif`;g.textAlign='left';for(const [i,n] of NAMED){const v=K.stars[i];if(!v||D.stars[i][2]>lim)continue;const p=proj(v);if(p)g.fillText(n,p[0]+5,p[1]-4)}}
 /* the ecliptic and the signs (tropical) */
 if(ST.zod){g.strokeStyle='rgba(214,178,94,.6)';g.setLineDash([6,6]);g.beginPath();let pen=false;for(const e of K.ecl){const p=proj(e.v);if(!p){pen=false;continue}if(pen)g.lineTo(p[0],p[1]);else g.moveTo(p[0],p[1]);pen=true}g.stroke();g.setLineDash([]);
  g.fillStyle='rgba(214,178,94,.85)';g.font=`${12*tiny}px -apple-system,Inter,sans-serif`;g.textAlign='center';for(let s=0;s<12;s++){const e=K.ecl.find(x=>x.L===s*30+15),p=e&&proj(e.v);if(p)g.fillText(SIGNS[s],p[0],p[1]-8);const b=K.ecl.find(x=>x.L===s*30),q=b&&proj(b.v);if(q){g.fillRect(q[0]-1,q[1]-5,2,10)}}}
 /* the ground */
 g.fillStyle=ST.night?'rgba(20,6,6,.93)':'rgba(16,22,18,.93)';for(let az=0;az<360;az+=10)for(let al=0;al>-90;al-=10){const c=[[az,al],[az+10,al],[az+10,al-10],[az,al-10]].map(([A,B])=>proj([Math.sin(rad(A))*Math.cos(rad(B)),Math.cos(rad(A))*Math.cos(rad(B)),Math.sin(rad(B))]));
  if(c.some(x=>!x))continue;g.beginPath();g.moveTo(c[0][0],c[0][1]);for(let k=1;k<4;k++)g.lineTo(c[k][0],c[k][1]);g.closePath();g.fill()}
 g.strokeStyle='rgba(150,190,150,.8)';g.lineWidth=1.5;g.beginPath();let pen=false;for(let az=0;az<=360;az+=2){const p=proj([Math.sin(rad(az)),Math.cos(rad(az)),0]);if(!p){pen=false;continue}if(pen)g.lineTo(p[0],p[1]);else g.moveTo(p[0],p[1]);pen=true}g.stroke();
 g.font=`bold ${16*tiny}px -apple-system,Inter,sans-serif`;g.textAlign='center';for(const [az,n] of [[0,'N'],[45,'NE'],[90,'E'],[135,'SE'],[180,'S'],[225,'SW'],[270,'W'],[315,'NW']]){const p=proj([Math.sin(rad(az)),Math.cos(rad(az)),0]);if(p){g.fillStyle=n==='N'?'#ff8a7a':'#cfe3cf';g.fillText(n,p[0],p[1]+22)}}
 /* Sun, Moon, and planets, drawn last so they sit above the ground line when they are low */
 for(const b of K.bodies){const p=proj(b.v);if(!p)continue;const below=b.v[2]<0;g.globalAlpha=below?0.45:1;
  if(b.k==='Moon')moonDisc(g,p[0],p[1],b.r*tiny*1.3,b.el);else{g.fillStyle=PCOL[b.k];g.beginPath();g.arc(p[0],p[1],b.r*tiny,0,7);g.fill()}
  g.fillStyle=PCOL[b.k];g.font=`${13*tiny}px -apple-system,Inter,sans-serif`;g.textAlign='left';g.fillText(GLY[b.k]+' '+b.k,p[0]+b.r*tiny+5,p[1]+4)}
 g.globalAlpha=1;
 /* the aim ring, and what is under it */
 g.strokeStyle='rgba(255,255,255,.5)';g.lineWidth=1;g.beginPath();g.arc(W/2,H/2,18,0,7);g.stroke();
 const [caz,calt]=azAlt(CAM.f);document.getElementById('aim').textContent=`Facing ${dirName(caz)} ${Math.round(caz)}° · ${calt>=0?'up':'down'} ${Math.abs(Math.round(calt))}°`;
 requestAnimationFrame(draw)}
function moonDisc(g,x,y,r,el){g.fillStyle='#2b2e3a';g.beginPath();g.arc(x,y,r,0,7);g.fill();const k=Math.cos(rad(el)),wax=el<180;g.fillStyle=PCOL.Moon;g.beginPath();
 g.arc(x,y,r,-Math.PI/2,Math.PI/2,!wax);g.ellipse(x,y,Math.abs(k)*r,r,0,Math.PI/2,-Math.PI/2,wax?k>0:k<0);g.fill()}
/* ---- taps: what is that? ---- */
cv.addEventListener('click',ev=>{if(dragged)return;if(!K)return;let best=null,bd=34;const tryV=(v,info)=>{const p=proj(v);if(!p)return;const d=Math.hypot(p[0]-ev.clientX,p[1]-ev.clientY);if(d<bd){bd=d;best=info(v)}};
 for(const b of K.bodies)tryV(b.v,v=>({n:GLY[b.k]+' '+b.k,v,lon:b.lon}));for(const [i,n] of NAMED)if(K.stars[i])tryV(K.stars[i],v=>({n,v,lon:null,i}));
 if(!best){for(let i=0;i<K.stars.length;i++){const v=K.stars[i];if(!v||D.stars[i][2]>3.5)continue;const f=D.info[i];tryV(v,v=>({n:(f&&f[7])||(f&&f[2]?f[2]+' '+(D.gen&&D.gen[f[4]]||f[4]):'Star'),v,i}))}}
 const el=document.getElementById('info');if(!best){el.hidden=true;return}const [az,alt]=azAlt(best.v);
 const sg=best.lon!=null?` · ${SIGNS[Math.floor(best.lon/30)]} ${Math.floor(best.lon%30)}°`:'',mag=best.i!=null?` · magnitude ${D.stars[best.i][2]}`:'';
 el.innerHTML=`<b>${best.n}</b><br>${alt>=0?Math.round(alt)+'° up':'below the horizon'}, ${dirName(az)} (${Math.round(az)}°)${sg}${mag}`;el.hidden=false;ST.tapInfo=best});
/* drag to look around when there are no sensors (or while held) */
let dragging=null,dragged=false;
cv.addEventListener('pointerdown',e=>{dragging=[e.clientX,e.clientY];dragged=false});
addEventListener('pointerup',()=>{dragging=null});
/* tap and drag turns tracking off and leaves the sky where it was (Gemini, Nov 7); Track Sky turns it back on */
addEventListener('pointermove',e=>{if(!dragging)return;const dx=e.clientX-dragging[0],dy=e.clientY-dragging[1];if(!dragged&&Math.abs(dx)+Math.abs(dy)<6)return;
 if(!dragged){dragged=true;if(ST.track&&CAM){const [az,alt]=azAlt(CAM.f);ST.yaw=n360(az-ST.off);ST.pitch=alt;ST.track=false;trackBtn()}}
 dragging=[e.clientX,e.clientY];const k=ST.fov/H;ST.yaw=n360(ST.yaw-dx*k);ST.pitch=Math.max(-89,Math.min(89,ST.pitch+dy*k))});
addEventListener('wheel',e=>{ST.fov=Math.max(15,Math.min(110,ST.fov*(e.deltaY>0?1.08:0.93)))},{passive:true});
/* ---- buttons ---- */
const $=id=>document.getElementById(id);
function start(){const go=()=>{addEventListener('deviceorientationabsolute',e=>onOrient(e,true));addEventListener('deviceorientation',e=>onOrient(e,false));$('start').hidden=true;setTimeout(()=>{if(!ST.sensors)$('msg').textContent='No motion sensors found here: drag to look around.'},1500)};
 if(window.DeviceOrientationEvent&&typeof DeviceOrientationEvent.requestPermission==='function'){const no=()=>{$('start').hidden=true;$('msg').textContent='Motion permission was not given: drag to look around.'};DeviceOrientationEvent.requestPermission().then(r=>{if(r==='granted')go();else no()}).catch(no)}else go();
 if(navigator.geolocation)navigator.geolocation.getCurrentPosition(p=>{ST.lat=p.coords.latitude;ST.lon=p.coords.longitude;ST.place='your location';SKY=null;K=null;$('where').textContent=placeText()},()=>{},{enableHighAccuracy:false,timeout:15000,maximumAge:6e5})}
const placeText=()=>`${Math.abs(ST.lat).toFixed(2)}°${ST.lat>=0?'N':'S'} ${Math.abs(ST.lon).toFixed(2)}°${ST.lon>=0?'E':'W'}, ${ST.place}`;
$('start').onclick=start;
function trackBtn(){const b=$('track');b.hidden=!ST.sensors||ST.track;$('msg').textContent=ST.sensors&&!ST.track?'Tracking is off: drag to look around, or tap Track Sky.':''}
$('track').onclick=()=>{ST.track=true;trackBtn()};
$('night').onclick=()=>{ST.night=!ST.night;document.body.classList.toggle('night',ST.night);$('night').setAttribute('aria-pressed',ST.night);save()};
$('snm').onclick=()=>{ST.snames=!ST.snames;$('snm').setAttribute('aria-pressed',ST.snames)};
$('lines').onclick=()=>{ST.cons=!ST.cons;$('lines').setAttribute('aria-pressed',ST.cons)};
$('zod').onclick=()=>{ST.zod=!ST.zod;$('zod').setAttribute('aria-pressed',ST.zod)};
$('zin').onclick=()=>{ST.fov=Math.max(15,ST.fov/1.3)};$('zout').onclick=()=>{ST.fov=Math.min(110,ST.fov*1.3)};
/* Align: put something bright you can see in the ring, pick it, and the compass error is corrected */
$('align').onclick=()=>{const L=$('alist');if(!L.hidden){L.hidden=true;return}if(!K)return;const up=K.bodies.filter(b=>b.v[2]>0&&b.k!=='Sun').map(b=>[b.k,GLY[b.k]+' '+b.k,b.v]).concat(NAMED.filter(([i])=>K.stars[i]&&K.stars[i][2]>0.08).map(([i,n])=>[n,n,K.stars[i]]));
 L.innerHTML=`<p>Point the ring at one of these in the real sky, then tap its name.</p>`+up.map((x,j)=>`<button data-j="${j}">${x[1]}</button>`).join('')+`<button data-j="reset">Reset Alignment</button>`;L.hidden=false;
 L.onclick=e=>{const j=e.target.dataset.j;if(j==null)return;if(j==='reset'){ST.off=0}else{const v=up[+j][2],want=azAlt(v)[0],have=azAlt(CAM.f)[0];ST.off=n360(ST.off+(want-have));}save();L.hidden=true;$('msg').textContent=j==='reset'?'Alignment reset.':'Aligned on '+up[+j][0]+'.'}};
$('where').textContent=placeText();document.body.classList.toggle('night',ST.night);
requestAnimationFrame(draw);
window.__sky={ST,camera:()=>CAM,sky:()=>K};
})();
